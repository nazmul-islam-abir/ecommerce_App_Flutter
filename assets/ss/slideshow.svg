<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" role="img" aria-labelledby="title desc">
  <title id="title">Menvogue app screenshot slideshow</title>
  <desc id="desc">Animated slideshow of all Menvogue screenshots from the assets/ss folder.</desc>
  <rect width="390" height="900" rx="28" fill="#f7fbfc"/>
  <text x="195" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1d1d1f">Menvogue Screenshots</text>

  <g opacity="1">
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">Splash - Men's Fashion Hero</text>
    <image href="splash-fashion-hero.png" x="55" y="88" width="280" height="780" preserveAspectRatio="xMidYMid meet"/>
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.09;0.10;1"/>
  </g>
  <g opacity="0">
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">Splash - Men's Shoes Hero</text>
    <image href="splash-shoes-hero.png" x="55" y="88" width="280" height="780" preserveAspectRatio="xMidYMid meet"/>
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.10;0.19;0.20;1"/>
  </g>
  <g opacity="0">
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">Splash - Men's Wallet Hero</text>
    <image href="splash-wallet-hero.png" x="55" y="88" width="280" height="780" preserveAspectRatio="xMidYMid meet"/>
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.20;0.29;0.30;1"/>
  </g>
  <g opacity="0">
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">Home Dashboard</text>
    <image href="home-dashboard.png" x="55" y="88" width="280" height="780" preserveAspectRatio="xMidYMid meet"/>
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.30;0.39;0.40;1"/>
  </g>
  <g opacity="0">
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">Product Catalog Overview</text>
    <image href="product-catalog-overview.png" x="55" y="88" width="280" height="780" preserveAspectRatio="xMidYMid meet"/>
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.40;0.49;0.50;1"/>
  </g>
  <g opacity="0">
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">Product Catalog Scroll</text>
    <image href="product-catalog-scroll.png" x="55" y="88" width="280" height="780" preserveAspectRatio="xMidYMid meet"/>
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.50;0.59;0.60;1"/>
  </g>
  <g opacity="0">
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">Flash Sales Listing</text>
    <image href="flash-sales-listing.png" x="55" y="88" width="280" height="780" preserveAspectRatio="xMidYMid meet"/>
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.60;0.69;0.70;1"/>
  </g>
  <g opacity="0">
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">Search Screen</text>
    <image href="search-screen.png" x="55" y="88" width="280" height="780" preserveAspectRatio="xMidYMid meet"/>
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.70;0.79;0.80;1"/>
  </g>
  <g opacity="0">
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">Orders List</text>
    <image href="orders-list.png" x="55" y="88" width="280" height="780" preserveAspectRatio="xMidYMid meet"/>
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.80;0.89;0.90;1"/>
  </g>
  <g opacity="0">
    <text x="195" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1d1d1f">Profile Screen</text>
    <image href="profile-screen.png" x="55" y="88" width="280" height="780" preserveAspectRatio="xMidYMid meet"/>
    <animate attributeName="opacity" dur="30s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;0.90;0.99;1"/>
  </g>
</svg>
